# Compose overlay for the public demo deployment: overrides the app image tag (default "dev"; set
# AMONY_IMAGE_TAG to test another tag, e.g. a PR build) and provides the Zitadel identity provider
# used by the demo. Pass it alongside the base and HTTPS files, enabling Zitadel with
# `--profile zitadel`.
services:
  amony:
    image: ghcr.io/merlijn/amony-app:${AMONY_IMAGE_TAG:-dev}

  # The demo uses Zitadel, not the bundled Dex; re-add the profile so Dex stays out of the demo.
  auth:
    profiles:
      - dex

  # Demo identity provider (Zitadel). Reuses the shared Postgres (first init is slow); console at
  # http://localhost:8080/ui/console, app via AMONY_IDP_*. Enabled with the `zitadel` profile.
  zitadel-db-init:
    # Creates the "zitadel" database if missing; Postgres has no CREATE DATABASE IF NOT EXISTS.
    image: postgres:17.2
    container_name: zitadel-db-init
    profiles:
      - zitadel
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USERNAME:-postgres}
      PGPASSWORD: ${DATABASE_PASSWORD:-changeme}
      PGDATABASE: postgres
    entrypoint: ["/bin/sh", "-c"]
    command:
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname='zitadel'" | grep -q 1 || psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE zitadel"
    restart: "no"

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.15.3}
    container_name: zitadel
    profiles:
      - zitadel
    # Zitadel writes its data into the container filesystem; the upstream compose also runs it as root.
    user: "0"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-8080}
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://${DATABASE_USERNAME:-postgres}:${DATABASE_PASSWORD:-changeme}@postgres:5432/zitadel?sslmode=disable"
      # Login V2 needs a separate container; the bundled legacy login keeps the trial single-container.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      # Initial admin (first init only); login name is <username>@<org-name>.<external-domain>, email defaults to it.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-ZITADEL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # Self-registration (first init only, like the admin above).
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: ${ZITADEL_ALLOW_REGISTER:-false}
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      # "external" when TLS is terminated by a reverse proxy (the demo), "disabled" for plain HTTP.
      # This flag overwrites externalSecure and tls.enabled, so it is the single source of truth.
      - --tlsMode
      - ${ZITADEL_TLS_MODE:-disabled}
    restart: unless-stopped

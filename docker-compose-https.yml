services:
  nginx:
    container_name: nginx-reverse-proxy
    # Stock image: it renders /etc/nginx/templates itself (20-envsubst-on-templates.sh) and the
    # certificate watcher is mounted as an additional entrypoint script.
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    ports:
      - "443:443"
    volumes:
      - ./docker/reverse-proxy/nginx/config:/etc/nginx/templates:ro
      - ./docker/reverse-proxy/nginx/config/shared-proxy-settings.conf:/etc/nginx/shared-proxy-settings.conf:ro
      - ./docker/reverse-proxy/nginx/reload-on-certificate-change.sh:/docker-entrypoint.d/40-reload-on-certificate-change.sh:ro
      # Unpacked frontend artifact; `current` is a symlink to the deployed release.
      - ./web:/srv/web:ro
      - certbot-data:/etc/letsencrypt
    environment:
      # Auth provider upstream behind the proxy: Dex (auth:5556) or Zitadel (zitadel:8080).
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-auth:5556}
      DOMAIN_TLD: ${DOMAIN_TLD}
      DOMAIN_SUB_AUTH: ${DOMAIN_SUB_AUTH}
      DOMAIN_SUB_AMONY: ${DOMAIN_SUB_AMONY}
      # Render the templates into /etc/nginx (where the includes expect them) and substitute only
      # the variables the templates actually use.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^(DOMAIN_TLD|DOMAIN_SUB_AUTH|DOMAIN_SUB_AMONY|AUTH_UPSTREAM)$
    restart: unless-stopped

  init-certificate:
    container_name: nginx-init-certificate
    profiles:
      - initial-certificate
    build:
      context: docker/reverse-proxy/certbot
      dockerfile: certbot.dockerfile
    image: amony/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
    env_file:
      - .env
    command:
      [
        "certbot", "certonly",
        "--authenticator", "dns-porkbun",
        "--dns-porkbun-credentials", "/etc/certbot-porkbun.ini",
        "--dns-porkbun-propagation-seconds", "60",
        "--email", "${LETSENCRYPT_EMAIL}",
        "--agree-tos",
        "--no-eff-email",
        "-d", "*.${DOMAIN_TLD}",
      ]
    restart: "no"

  amony:
    # Public authorize endpoint (browser-facing); .env overrides the Dex default (Zitadel in the demo).
    environment:
      AMONY_IDP_AUTHORIZE_URL: ${AMONY_IDP_AUTHORIZE_URL:-https://${DOMAIN_SUB_AUTH}.${DOMAIN_TLD}/dex/auth}
      # Only the public hosts are accepted (replaces the local defaults in application.conf).
      AMONY_ALLOWED_HOSTS_0: ${DOMAIN_SUB_AMONY}.${DOMAIN_TLD}

  auth:
    # Uses the stock Dex image: docker/dex/config.yaml.tmpl is rendered by the image's
    # built-in gomplate entrypoint. Only the public hostnames differ from the base setup.
    environment:
      DEX_ISSUER: https://${DOMAIN_SUB_AUTH}.${DOMAIN_TLD}/dex
      DEX_AMONY_REDIRECT_URI: https://${DOMAIN_SUB_AMONY}.${DOMAIN_TLD}/api/auth/callback/dex

  certbot:
    container_name: nginx-certbot
    build:
      context: docker/reverse-proxy/certbot
      dockerfile: certbot.dockerfile
    image: amony/certbot
    depends_on:
      init-certificate:
        condition: service_completed_successfully
        required: false
    volumes:
      - certbot-data:/etc/letsencrypt
    env_file:
      - .env
    command:
      [
        "/bin/sh",
        "-c",
        "trap exit TERM; while :; do echo \"[$(date)] Running certbot renew\"; certbot renew; sleep 12h & wait $${!}; done;",
      ]
    restart: unless-stopped

volumes:
  certbot-data:

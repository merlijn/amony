services:
  nginx:
    container_name: nginx-reverse-proxy
    build:
      context: docker/reverse-proxy/nginx
      dockerfile: nginx.dockerfile
    image: amony/nginx
    ports:
      - "443:443"
    volumes:
      - ./docker/reverse-proxy/nginx/config:/etc/nginx/templates:ro
      - ./docker/reverse-proxy/nginx/config/shared-proxy-settings.conf:/etc/nginx/shared-proxy-settings.conf:ro
      - certbot-data:/etc/letsencrypt
    env_file:
      - .env
    restart: unless-stopped

  init-certificate:
    container_name: nginx-init-certificate
    profiles:
      - initial-certificate
    build:
      context: docker/reverse-proxy/certbot
      dockerfile: certbot.dockerfile
    image: amony/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
    env_file:
      - .env
    command:
      [
        "certbot", "certonly",
        "--authenticator", "dns-porkbun",
        "--dns-porkbun-credentials", "/etc/certbot-porkbun.ini",
        "--dns-porkbun-propagation-seconds", "60",
        "--email", "${LETSENCRYPT_EMAIL}",
        "--agree-tos",
        "--no-eff-email",
        "-d", "*.${DOMAIN_TLD}",
      ]
    restart: "no"

  amony:
    # Public authorize endpoints (browser-facing); token/userinfo stay on the internal network.
    environment:
      AMONY_OAUTH_AUTHORIZE_URL: https://${DOMAIN_SUB_AUTH}.${DOMAIN_TLD}/dex/auth
      AMONY_ADMIN_OAUTH_AUTHORIZE_URL: https://${DOMAIN_SUB_AUTH}.${DOMAIN_TLD}/dex/auth
      # Only the public hosts are accepted (replaces the local defaults in application.conf).
      AMONY_ALLOWED_HOSTS_0: ${DOMAIN_SUB_AMONY}.${DOMAIN_TLD}
      AMONY_ALLOWED_HOSTS_1: ${DOMAIN_SUB_ADMIN}.${DOMAIN_TLD}

  auth:
    # Uses the stock Dex image: docker/dex/config.yaml.tmpl is rendered by the image's
    # built-in gomplate entrypoint. Only the public hostnames differ from the base setup.
    environment:
      DEX_ISSUER: https://${DOMAIN_SUB_AUTH}.${DOMAIN_TLD}/dex
      DEX_AMONY_REDIRECT_URI: https://${DOMAIN_SUB_AMONY}.${DOMAIN_TLD}/api/auth/callback/dex
      DEX_AMONY_ADMIN_REDIRECT_URI: https://${DOMAIN_SUB_ADMIN}.${DOMAIN_TLD}/api/auth/callback/admin

  certbot:
    container_name: nginx-certbot
    build:
      context: docker/reverse-proxy/certbot
      dockerfile: certbot.dockerfile
    image: amony/certbot
    depends_on:
      init-certificate:
        condition: service_completed_successfully
        required: false
    volumes:
      - certbot-data:/etc/letsencrypt
    env_file:
      - .env
    command:
      [
        "/bin/sh",
        "-c",
        "trap exit TERM; while :; do echo \"[$(date)] Running certbot renew\"; certbot renew; sleep 12h & wait $${!}; done;",
      ]
    restart: unless-stopped

volumes:
  certbot-data:

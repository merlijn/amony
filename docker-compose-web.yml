services:
  web:
    container_name: amony-web
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      # Unpacked frontend artifact; `current` is a symlink to the deployed release.
      - ./web:/srv/web:ro
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

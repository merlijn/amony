# !!! Note:
# When enabled = false then authentication is COMPLETELY disabled and EVERYONE has admin access and ALL other auth config is ignored
# Only recommended for development local only deployments.
enabled = true
enabled = ${?AMONY_AUTH_ENABLED}

require-login = false
require-login = ${?AMONY_AUTH_REQUIRE_LOGIN}

identity-providers = [
  {
    name = "dex"
    name = ${?AMONY_IDP_NAME}
    client-id = "amony-app"
    client-id = ${?AMONY_IDP_CLIENT_ID}
    client-secret = "amony-dex-secret"
    client-secret = ${?AMONY_IDP_CLIENT_SECRET}
    authorize-url = "http://localhost:5556/dex/auth"
    authorize-url = ${?AMONY_IDP_AUTHORIZE_URL}
    token-url = "http://localhost:5556/dex/token"
    token-url = ${?AMONY_IDP_TOKEN_URL}
    user-info-url = "http://localhost:5556/dex/userinfo"
    user-info-url = ${?AMONY_IDP_USERINFO_URL}
    # Optional (browser-facing): when set, logout also redirects to the provider's end-session endpoint (OIDC RP-Initiated Logout).
    end-session-url = ${?AMONY_IDP_END_SESSION_URL}
    scopes = [ "openid", "profile", "email" ]
    # a comma-separated list (e.g. `admin,user`) of roles implicitly granted to any user authenticated via this provider
    default-roles = ""
    default-roles = ${?AMONY_IDP_DEFAULT_ROLES}
    # Dot-path to the roles claim in the userinfo response, e.g. "groups" (Dex) or "urn:zitadel:iam:org:project:roles" (Zitadel).
    roles-claim = "groups"
    roles-claim = ${?AMONY_IDP_ROLES_CLAIM}
    # How to read the claim value: "array" (a list of role names) or "object-keys" (the object's keys are the roles).
    roles-from = "array"
    roles-from = ${?AMONY_IDP_ROLES_FROM}
    # Extra headers sent on the server-side token/userinfo calls
    extra-headers = ""
    extra-headers = ${?AMONY_IDP_EXTRA_HEADERS}
  }
]

secure-cookies = true
secure-cookies = ${?AMONY_SECURE_COOKIES}

# How long a federated login attempt stays valid: the lifetime of the oauth_login_state cookie
# and the validity window of the server-side state row.
oauth-state-expiration = 300 seconds
oauth-state-expiration = ${?AMONY_IDP_STATE_EXPIRATION}

jwt {
  algorithm {
    type = "HS256"
    secret-key = "changeme"
    secret-key = ${?AMONY_JWT_SECRET_KEY}
  }
  access-token-expiration = 15 minutes
  refresh-token-expiration = 7 days
}

access-control = {
  anonymous {
    permissions = [ "search-resources", "preview-resource", "view-resource" ]
  }

  authenticated {
    permissions = [ "search-resources", "manage-resources", "preview-resource", "view-resource", "upload-resource", "manage-collections" ]
  }
}
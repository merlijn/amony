# Thumbnail resolutions are a closed, configurable set of pixel sizes. Clients request one of these
# sizes (by number) and a dimension (width or height)
thumbnails {

  # Roughly geometric (1.5x / 1.33x) so the relative jump between sizes stays even across the range.
  allowed-resolutions = [ 128, 192, 256, 384, 512, 768, 1024, 1536, 2048, 3072, 4096, 6144, 8192 ]

  default-resolution = 384

  # Image formats the server can encode thumbnails in, best compression first. The frontend picks the
  # first format its browser can actually decode.
  supported-formats = [ avif, jxl, webp, jpeg ]

  # How many ladder steps to lower the size the client requested before serving it (0 = serve the
  # requested size). Lets an operator trade quality for bandwidth, e.g. 1: 512 -> 384.
  resolution-step-down = 0

  # How the frontend picks a size for a displayed box relative to the device pixels it needs:
  # "round-up" (smallest size >= needed), "round-down" (largest size <= needed) or "round-nearest".
  resolution-picking-strategy = "round-down"
}

buckets = [
  {
    type = "LocalDirectory"

    id = "media"

    # location of your media
    path = "../data/media"
    path = ${?AMONY_MEDIA_PATH}

    # path where to write uploaded files
    relative-upload-path = "_upload"

    # the hashing algorithm to use
    hashing-algorithm = {
      type = "partial-hash"
    }

    sync {

      new-files-owner = "admin"

      sync-on-startup = true
      sync-on-startup = ${?AMONY_MEDIA_SYNC_ON_STARTUP}

      # whether to automatically monitor the directory for changes
      enabled = false
      enabled = ${?AMONY_MEDIA_SCAN_ENABLED}

      poll-interval = 300 seconds

      extensions = [ mp4, webm, mkv, mpeg, mpg, wmv, mov, avi, jpg, jpeg, png, webp ]

      # whether to exclude hidden files and directories (starting with a dot)
      exclude-hidden-files = true

      # how many threads to use when scanning
      scan-parallel-factor = 4

      # whether to verify the hashes of already indexed files
      verify-existing-hashes = false
    }
  }
]
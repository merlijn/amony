# Thumbnail resolutions are a closed, configurable set of pixel sizes. Clients choose a key and a
# dimension (width or height); unknown keys fall back to the default. Keeping the set closed prevents
# a client from requesting arbitrary sizes and polluting the derived-thumbnail cache.
thumbnails {
  allowed-resolutions {
    "xxs" = 144
    "xs"  = 240
    "s"   = 352
    "m"   = 512
    "l"   = 1080
    "xl"  = 2160
    "xxl" = 4320
  }
  default-resolution = "s"

  # How the frontend picks a thumbnail size for a displayed box, relative to the device-pixel size
  # it needs: "round-up" (smallest size that is >= needed), "round-down" (largest size that is <=
  # needed) or "round-nearest". Rounding up is the sharpest but transfers the most data.
  resolution-picking-strategy = "round-up"
}

buckets = [
  {
    type = "LocalDirectory"

    id = "media"

    # location of your media
    path = "../data/media"
    path = ${?AMONY_MEDIA_PATH}

    # path where to write uploaded files
    relative-upload-path = "_upload"

    # the hashing algorithm to use
    hashing-algorithm = {
      type = "partial-hash"
    }

    sync {

      new-files-owner = "admin"

      sync-on-startup = true
      sync-on-startup = ${?AMONY_MEDIA_SYNC_ON_STARTUP}

      # whether to automatically monitor the directory for changes
      enabled = false
      enabled = ${?AMONY_MEDIA_SCAN_ENABLED}

      poll-interval = 300 seconds

      extensions = [ mp4, webm, mkv, mpeg, mpg, wmv, mov, avi, jpg, jpeg, png, webp ]

      # whether to exclude hidden files and directories (starting with a dot)
      exclude-hidden-files = true

      # how many threads to use when scanning
      scan-parallel-factor = 4

      # whether to verify the hashes of already indexed files
      verify-existing-hashes = false
    }
  }
]
# Preview resolutions are a closed, configurable set of pixel sizes. Clients request one of these
# sizes (by number) and a dimension (width or height)
previews {

  allowed-resolutions = [ 64, 128, 256, 512, 768, 1024 ]
  default-resolution = 256

  # Image formats the server can encode previews in, best compression first. The frontend picks the
  # first format its browser can actually decode. Supported options: avif, jxl, webp, jpeg.
  # note: the SVT-AV1 encoder lower bound size (width or height) is 64px
  supported-image-formats = [ webp, jpeg ]

  # Video container formats the server can produce (or serve) preview clips in.
  supported-video-formats = [ mp4 ]

  # Extra ffmpeg encoder arguments applied per image format. Formats without an entry (or an empty
  # list) let ffmpeg pick its default encoder for the output extension.
  format-options {
    avif = [ "-c:v", "libsvtav1", "-pix_fmt", "yuv420p" ]
  }

  # How many ladder steps to lower the size the client requested before serving it (0 = serve the
  # requested size). Lets an operator trade quality for bandwidth, e.g. 1: 512 -> 384.
  resolution-step-down = 0

  # How the frontend picks a size for a displayed box relative to the device pixels it needs:
  # "round-up" (smallest size >= needed), "round-down" (largest size <= needed) or "round-nearest".
  resolution-picking-strategy = "round-down"
}

# The bucket (media source) that is stored in the database on first startup when no buckets exist yet.
# After that, buckets are managed through the admin API and this configuration is ignored.
default-bucket {
  type = "LocalDirectory"

  id = "media"

  # Optional role required to see this bucket. When unset the bucket is public; admins always
  # have access. Example: required-role = "authenticated" hides the bucket from anonymous users.
  # required-role = "authenticated"

  # location of your media
  path = "../data/media"
  path = ${?AMONY_DEFAULT_MEDIA_PATH}

  # path where to write uploaded files
  relative-upload-path = "_upload"

  # whether to generate all configured thumbnails and preview clips for a resource as soon as it
  # is added (via scan or upload)
  generate-previews-on-add = false
  generate-previews-on-add = ${?AMONY_DEFAULT_MEDIA_GENERATE_PREVIEWS_ON_ADD}

  # the hashing algorithm to use
  hashing-algorithm = {
    type = "partial-hash"
  }

  sync {

    new-files-owner = "admin"

    sync-on-startup = true
    sync-on-startup = ${?AMONY_DEFAULT_MEDIA_SYNC_ON_STARTUP}

    # whether to automatically monitor the directory for changes
    enabled = false
    enabled = ${?AMONY_DEFAULT_MEDIA_SCAN_ENABLED}

    poll-interval = 300 seconds

    # Case-insensitive glob patterns (java.nio PathMatcher syntax) relative to the bucket path. A file is indexed when it
    # matches an include pattern and no exclude pattern. A directory matching an exclude pattern is skipped entirely.
    # Note: files that no longer match are removed from the index, including their tags and metadata.
    include-patterns = [ "**/*.{mp4,webm,mkv,mpeg,mpg,wmv,mov,avi,jpg,jpeg,png,webp}" ]

    # excludes hidden files and directories (starting with a dot)
    exclude-patterns = [ "**/.*" ]

    # how many threads to use when scanning
    scan-parallel-factor = 4
  }
}

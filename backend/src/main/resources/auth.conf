# !!! Note:
# When enabled = false then authentication is COMPLETELY disabled and EVERYONE has admin access and ALL other auth config is ignored
# Only recommended for development local only deployments.
enabled = true
enabled = ${?AMONY_AUTH_ENABLED}

require-login = false
require-login = ${?AMONY_AUTH_REQUIRE_LOGIN}

identity-providers = [
  {
    name = "dex"
    name = ${?AMONY_OAUTH_NAME}
    client-id = "amony-app"
    client-id = ${?AMONY_OAUTH_CLIENT_ID}
    client-secret = "amony-dex-secret"
    client-secret = ${?AMONY_OAUTH_CLIENT_SECRET}
    authorize-url = "http://localhost:5556/dex/auth"
    authorize-url = ${?AMONY_OAUTH_AUTHORIZE_URL}
    token-url = "http://localhost:5556/dex/token"
    token-url = ${?AMONY_OAUTH_TOKEN_URL}
    user-info-url = "http://localhost:5556/dex/userinfo"
    user-info-url = ${?AMONY_OAUTH_USERINFO_URL}
    # Optional (browser-facing). When set, logout also redirects to the provider's end-session
    # endpoint (OIDC RP-Initiated Logout) so the upstream session is ended as well.
    end-session-url = ${?AMONY_OAUTH_END_SESSION_URL}
    scopes = [ "openid", "profile", "email" ]
    # Roles are read from the OIDC userinfo response. `roles-claim` is a dot-path to the claim:
    # "groups" (Dex), "realm_access.roles" (Keycloak) or "urn:zitadel:iam:org:project:roles"
    # (Zitadel). `roles-from` is how to read its value: "array" for an array of role names,
    # "object-keys" for an object whose keys are the roles. When no claim is configured, or the
    # claim is absent, `default-roles` is used. Keep `default-roles` empty (or low-privilege) in
    # production, since absent provider roles fall back to it.
    default-roles = [ "admin" ]
    roles-claim = "groups"
    roles-claim = ${?AMONY_OAUTH_ROLES_CLAIM}
    roles-from = "array"
    roles-from = ${?AMONY_OAUTH_ROLES_FROM}
    # Extra headers sent on the server-side token/userinfo calls, as a comma-separated list of
    # `Name: Value` pairs. Needed when the app reaches the provider under a host that differs from
    # its public domain. For a Dockerised Zitadel, set AMONY_OAUTH_EXTRA_HEADERS to
    # "X-Zitadel-Instance-Host: <public origin>" (including the port, e.g. localhost:8080) so the
    # instance resolves and the token's issuer matches.
    extra-headers = ""
    extra-headers = ${?AMONY_OAUTH_EXTRA_HEADERS}
  }
]

secure-cookies = true
secure-cookies = ${?AMONY_SECURE_COOKIES}

# How long a federated login attempt stays valid: the lifetime of the oauth_login_state cookie
# and the validity window of the server-side state row.
oauth-state-expiration = 300 seconds
oauth-state-expiration = ${?AMONY_OAUTH_STATE_EXPIRATION}

jwt {
  algorithm {
    type = "HS256"
    secret-key = "changeme"
    secret-key = ${?AMONY_JWT_SECRET_KEY}
  }
  access-token-expiration = 15 minutes
  refresh-token-expiration = 7 days
}

access-control = {
  anonymous {
    permissions = [ "search-resources", "preview-resource", "view-resource" ]
  }

  authenticated {
    permissions = [ "search-resources", "manage-resources", "preview-resource", "view-resource", "upload-resource", "manage-collections" ]
  }
}
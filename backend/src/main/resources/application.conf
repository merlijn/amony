amony {

  auth = { include "auth.conf" }
  auth = { include file("/app/auth.conf") }

  database = { include "database.conf" }
  database = { include file("/app/database.conf") }

  resources = { include "resources.conf" }
  resources = { include file("/app/resources.conf") }

  observability {
    otel-enabled = false
    otel-enabled = ${?AMONY_OTEL_ENABLED}
    log-levels = { }
  }

  ffmpeg {
    parallelism = 4
    ffprobe-timeout = 5 seconds
  }

  search {

    # the default nr of results returned when no parameter is given
    default-number-of-results = 10

    # the maximum nr of results returned, otherwise a 400 response is returned
    maximum-number-of-results = 128

    solr {
      path = "../data/solr"
      path = ${?AMONY_SOLR_PATH}
      commit-within-millis = 500
    }
  }

  api {

    web-client-path = /app/assets
    web-client-path = ${?AMONY_WEB_CLIENT_PATH}

    upload-size-limit = 500000

    request-timeout = 10 seconds

    # Hosts (Host / X-Forwarded-Host) that requests may use. Anything else is rejected, so a client
    # cannot make the backend act on a foreign domain (e.g. build an OAuth redirect_uri for an
    # attacker-controlled host). The defaults cover local development; a deployment sets
    # AMONY_ALLOWED_HOSTS_0, AMONY_ALLOWED_HOSTS_1, ... which replace the defaults.
    allowed-hosts = [
      "localhost:8182", "127.0.0.1:8182",
      "localhost:5173", "127.0.0.1:5173",
      "localhost:5174", "127.0.0.1:5174",
      "localhost:8183", "127.0.0.1:8183",
    ]
    allowed-hosts = ${?AMONY_ALLOWED_HOSTS[]}

    http {
      enabled = true
      enabled = ${?AMONY_HTTP_ENABLED}
      host = "0.0.0.0"
      host = ${?AMONY_HTTP_HOST}
      port = 8182
      port = ${?AMONY_HTTP_PORT}
    }

    # it is recommended to use an https reverse proxy in front of the web server instead of this
    https {
      enabled = false
      enabled = ${?AMONY_HTTPS_ENABLED}
      host = "0.0.0.0"
      host = ${?AMONY_HTTPS_HOST}
      port = 4433
      port = ${?AMONY_HTTPS_PORT}
      private-key-pem = "/path/to/my/privkey.pem"
      certificate-chain-pem = "/path/to/my/fullchain.pem"
    }
  }
}
amony.message-bus {

  # Fallback poll for notifications that were lost or whose consumer crashed. The NOTIFY path handles the
  # common case; this bounds how long a missed notification, or a message awaiting a retry, can sit.
  poll-interval = 3 seconds
  poll-interval = ${?AMONY_MESSAGE_BUS_POLL_INTERVAL}

  # Wait before retrying a failed message, so a failing processor (e.g. Solr down) is not hammered.
  retry-backoff = 3 seconds
  retry-backoff = ${?AMONY_MESSAGE_BUS_RETRY_BACKOFF}

  # How long a consumer holds a partition lease before another node can take over if the consumer crashes.
  lease-duration = 30 seconds
  lease-duration = ${?AMONY_MESSAGE_BUS_LEASE_DURATION}

  # Number of partitions a single consumer group instance can drain concurrently on one node.
  parallelism = 4
  parallelism = ${?AMONY_MESSAGE_BUS_PARALLELISM}

  # Dedicated database pool size for the message bus (one LISTEN connection per consumer group plus worker queries).
  pool-size = 8
  pool-size = ${?AMONY_MESSAGE_BUS_POOL_SIZE}

  # How often messages every consumer group has processed are purged.
  purge-interval = 1 hour
  purge-interval = ${?AMONY_MESSAGE_BUS_PURGE_INTERVAL}

  # How long fully-processed messages are kept before they are purged.
  retention = 7 days
  retention = ${?AMONY_MESSAGE_BUS_RETENTION}

  # Size of the per-connection queue of NOTIFY payloads.
  notification-queue-size = 10000
  notification-queue-size = ${?AMONY_MESSAGE_BUS_NOTIFICATION_QUEUE_SIZE}
}

amony.media-processing {

  # Limits and timeouts for external media processes (ffmpeg, ffprobe and ImageMagick). The bounded
  # queue rejects work with a 503 once full, instead of accumulating unbounded requests.
  max-concurrent = 6
  max-queued = 32
  queue-timeout = 10 seconds

  ffprobe-timeout = 5 seconds
  image-metadata-timeout = 5 seconds
  thumbnail-timeout = 10 seconds
  clip-timeout = 1 minutes
  tile-timeout = 1 minutes
  remux-timeout = 5 minutes

  # Hardware video decoding for derived previews. Generating a preview is almost entirely video
  # decoding, so the GPU's fixed-function media block can be much faster than the CPU. Off by default:
  # it needs a GPU device passed into the container (see docker-compose.vaapi.yml) and a working driver.
  hardware-decode {
    enabled = false
    enabled = ${?AMONY_HARDWARE_DECODE_ENABLED}

    # Decoder backend. Only `vaapi` (Intel Quick Sync and AMD on Linux) is supported for now.
    mode = vaapi
    mode = ${?AMONY_HARDWARE_DECODE_MODE}

    # GPU render node used by VAAPI. It only exists inside the container when the host device is
    # passed through.
    vaapi-device = "/dev/dri/renderD128"
    vaapi-device = ${?AMONY_VAAPI_DEVICE}
  }
}

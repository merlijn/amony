name: Build and deploy

on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

# Main merges all publish the shared dev tags, so parallel runs can mix architectures or leave dev
# on an older commit. Queue them instead; pull requests still cancel their own stale runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: amony-app

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # Exercise the backend job when the workflow itself changes.
              - '.github/workflows/build.yml'

  web-image:

    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      # Fork PRs get a read-only token, so only push from branches of this repository.
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute the image reference and tags
      id: ref
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.number }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # Content-addressed: the tag covers the frontend tree and the web image inputs, so an
        # unchanged web client reuses the image and a deploy can pin the exact build.
        hash="$(git rev-parse HEAD:frontend HEAD:docker/web HEAD:.dockerignore | git hash-object --stdin)"
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amony-web"
        echo "ref=$image:web-$hash" >> "$GITHUB_OUTPUT"

        publish=false
        alias_tags=()
        if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
          publish=true
          alias_tags+=("dev" "sha-$COMMIT_SHA")
        elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
          publish=true
          alias_tags+=("latest" "${GITHUB_REF_NAME#v}")
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] \
             && git log -1 --pretty=%s "$COMMIT_SHA" | grep -q '#publish'; then
          publish=true
          alias_tags+=("pr-$PR_NUMBER")
        fi

        echo "publish=$publish" >> "$GITHUB_OUTPUT"
        {
          echo "tags<<EOF"
          echo "$image:web-$hash"
          for tag in "${alias_tags[@]}"; do echo "$image:$tag"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "alias_tags<<EOF"
          for tag in "${alias_tags[@]}"; do echo "$image:$tag"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Look for an existing image
      id: existing
      run: |
        if docker manifest inspect "${{ steps.ref.outputs.ref }}" >/dev/null 2>&1; then
          echo "This web client was built before, reusing the image"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Point the aliases at the existing image
      if: steps.existing.outputs.exists == 'true' && steps.ref.outputs.publish == 'true'
      env:
        ALIAS_TAGS: ${{ steps.ref.outputs.alias_tags }}
        REF: ${{ steps.ref.outputs.ref }}
      run: |
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          docker buildx imagetools create -t "$tag" "$REF"
        done <<< "$ALIAS_TAGS"

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      if: steps.existing.outputs.exists != 'true'
      with:
        version: 12.21.0
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.existing.outputs.exists != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Build the web client
      if: steps.existing.outputs.exists != 'true'
      working-directory: frontend
      run: |
        pnpm install --frozen-lockfile
        pnpm run generate
        pnpm run build

    - name: Build and publish the web image
      if: steps.existing.outputs.exists != 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: docker/web/Dockerfile
        # The assets are identical per platform; publish both so the image matches the app.
        platforms: linux/amd64,linux/arm64
        push: ${{ steps.ref.outputs.publish == 'true' }}
        tags: ${{ steps.ref.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Amony web client

  build-backend:
    needs: changes
    # Every main commit needs an app image tag for the demo. Only skip unchanged PR builds.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.backend == 'true')
    runs-on: ${{ matrix.runner }}
    # Both matrix legs compute the same value, so the merged output is stable.
    outputs:
      publish: ${{ steps.git-info.outputs.publish }}

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    defaults:
      run:
        working-directory: backend

    env:
      JIB_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
      JIB_TAGS: >-
        ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) ||
            github.ref == 'refs/heads/main' && format('dev,sha-{0}', github.sha) || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pinned base image
        working-directory: .
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/amony-base
        run: |
          tag=$(sed -n 's/^val baseImageTag *= *"\([^"]*\)".*/\1/p' backend/build.sbt | head -1)
          ref="${BASE_IMAGE,,}:$tag"
          echo "Base image: $ref"
          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::Base image $ref is not published. Run the 'Build base image' workflow, then retry."
            exit 1
          fi

      - name: Build with sbt
        timeout-minutes: 10
        run: sbt "clean ; test ; jibDockerBuild ; jibWriteDockerTagsFile"

      - name: Get git info
        id: git-info
        run: |
          echo "-- jib docker image tags --"
          cat .docker-tags.txt
          echo "\n-- git tags --"
          git --no-pager tag --list
          echo "\n--"
          
          echo "github event name: ${{ github.event_name }}"
          echo "github ref: ${{ github.ref }}"
          
          if [ "${{ github.event_name }}" == "push" ]; then
            commit_sha="${{ github.sha }}"
          else
            commit_sha="${{ github.event.pull_request.head.sha }}"
          fi
          
          commit_tag="$(git tag --points-at HEAD)"
          commit_msg="$(git log -1 --pretty=%s $commit_sha)"
          echo "commit tag: $commit_tag"
          echo "commit_msg=$commit_msg" >> $GITHUB_OUTPUT
          echo "commit msg: $commit_msg"

          # Publish dev + the commit tag on main, latest + version on a release tag,
          # or on any build whose commit message contains #publish.
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "$commit_msg" == *"#publish"* ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Docker image with arch suffix
        if: steps.git-info.outputs.publish == 'true'
        run: |
          # The .docker-tags.txt file is created by the jibWriteDockerTagsFile task in the build.sbt.
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            docker tag $IMAGE:$tag $IMAGE:$tag-${{ matrix.arch }}
            docker push $IMAGE:$tag-${{ matrix.arch }}
          done < .docker-tags.txt
          
      - name: Upload docker tags artifact
        if: steps.git-info.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-tags-${{ matrix.arch }}
          path: backend/.docker-tags.txt
          include-hidden-files: true

  create-manifest:
    needs: build-backend
    runs-on: ubuntu-26.04
    if: needs.build-backend.result == 'success' && needs.build-backend.outputs.publish == 'true'

    steps:
      - name: Download docker tags
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docker-tags-amd64
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            echo "Creating manifest for $IMAGE:$tag"
            docker manifest create $IMAGE:$tag \
              $IMAGE:$tag-amd64 \
              $IMAGE:$tag-arm64
          
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-amd64 --os linux --arch amd64
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-arm64 --os linux --arch arm64
          
            docker manifest push $IMAGE:$tag
          done < .docker-tags.txt

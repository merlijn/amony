name: Build and deploy

on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: amony-app

jobs:
  build-frontend:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend

    - run: npm install --save
    - run: npm run generate
    - run: npm run build --if-present

    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: frontend-dist
        path: frontend/dist

  build-backend:
    needs: build-frontend
    runs-on: ${{ matrix.runner }}
    # Both matrix legs compute the same value, so the merged output is stable.
    outputs:
      publish: ${{ steps.git-info.outputs.publish }}

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    defaults:
      run:
        working-directory: backend

    env:
      JIB_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
      JIB_TAGS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build with sbt
        timeout-minutes: 10
        run: sbt "clean ; test ; jibDockerBuild ; jibWriteDockerTagsFile"

      - name: Get git info
        id: git-info
        run: |
          echo "-- jib docker image tags --"
          cat .docker-tags.txt
          echo "\n-- git tags --"
          git --no-pager tag --list
          echo "\n--"
          
          echo "github event name: ${{ github.event_name }}"
          echo "github ref: ${{ github.ref }}"
          
          if [ "${{ github.event_name }}" == "push" ]; then
            commit_sha="${{ github.sha }}"
          else
            commit_sha="${{ github.event.pull_request.head.sha }}"
          fi
          
          commit_tag="$(git tag --points-at HEAD)"
          commit_msg="$(git log -1 --pretty=%s $commit_sha)"
          echo "commit tag: $commit_tag"
          echo "commit_msg=$commit_msg" >> $GITHUB_OUTPUT
          echo "commit msg: $commit_msg"

          # Publish dev on main, latest + version on a release tag,
          # or on any build whose commit message contains #publish.
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "$commit_msg" == *"#publish"* ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Docker image with arch suffix
        if: steps.git-info.outputs.publish == 'true'
        run: |
          # The .docker-tags.txt file is created by the jibWriteDockerTagsFile task in the build.sbt.
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            docker tag $IMAGE:$tag $IMAGE:$tag-${{ matrix.arch }}
            docker push $IMAGE:$tag-${{ matrix.arch }}
          done < .docker-tags.txt
          
      - name: Upload docker tags artifact
        if: steps.git-info.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: docker-tags-${{ matrix.arch }}
          path: backend/.docker-tags.txt
          include-hidden-files: true

  create-manifest:
    needs: build-backend
    runs-on: ubuntu-24.04
    if: needs.build-backend.result == 'success' && needs.build-backend.outputs.publish == 'true'

    steps:
      - name: Download docker tags
        uses: actions/download-artifact@v6
        with:
          name: docker-tags-amd64
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            echo "Creating manifest for $IMAGE:$tag"
            docker manifest create $IMAGE:$tag \
              $IMAGE:$tag-amd64 \
              $IMAGE:$tag-arm64
          
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-amd64 --os linux --arch amd64
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-arm64 --os linux --arch arm64
          
            docker manifest push $IMAGE:$tag
          done < .docker-tags.txt

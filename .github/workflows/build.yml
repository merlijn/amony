name: Build and deploy

on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: amony-app

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # Exercise the backend job when the workflow itself changes.
              - '.github/workflows/build.yml'

  web-assets:

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [26.x]

    steps:
    - uses: actions/checkout@v5
    - uses: oras-project/setup-oras@v1
    - uses: docker/login-action@v4
      # Fork PRs get a read-only token, so only push from branches of this repository.
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute the artifact reference
      id: ref
      working-directory: .
      run: |
        # Content-addressed: the tag is the git tree hash of frontend/, so an unchanged frontend
        # reuses the artifact and a deploy derives the same tag from its own checkout.
        echo "tag=fe-$(git rev-parse HEAD:frontend)" >> "$GITHUB_OUTPUT"
        echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amony-web" >> "$GITHUB_OUTPUT"

    - name: Look for an existing artifact
      id: existing
      working-directory: .
      run: |
        if oras manifest fetch "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" >/dev/null 2>&1; then
          echo "This frontend tree was built before, reusing the artifact"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: pnpm/action-setup@v4
      if: steps.existing.outputs.exists != 'true'
      with:
        version: 11.12.0
    - name: Use Node.js ${{ matrix.node-version }}
      if: steps.existing.outputs.exists != 'true'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Build the web client
      if: steps.existing.outputs.exists != 'true'
      run: |
        pnpm install --frozen-lockfile
        pnpm run generate
        pnpm run build

    - name: Publish the web client artifact
      if: steps.existing.outputs.exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      working-directory: .
      run: |
        tar -czf frontend-dist.tar.gz -C frontend/dist .
        oras push "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" \
          frontend-dist.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip \
          --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
          --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  build-backend:
    needs: changes
    # The application image only changes with the backend or its base image, so a frontend-only
    # change does not need a rebuild. Release tags always build, and so does the build when the
    # change detector itself failed.
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.backend == 'true')
    runs-on: ${{ matrix.runner }}
    # Both matrix legs compute the same value, so the merged output is stable.
    outputs:
      publish: ${{ steps.git-info.outputs.publish }}

    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    defaults:
      run:
        working-directory: backend

    env:
      JIB_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
      JIB_TAGS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pinned base image
        working-directory: .
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/amony-base
        run: |
          tag=$(sed -n 's/^val baseImageTag *= *"\([^"]*\)".*/\1/p' backend/build.sbt | head -1)
          ref="${BASE_IMAGE,,}:$tag"
          echo "Base image: $ref"
          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::Base image $ref is not published. Run the 'Build base image' workflow, then retry."
            exit 1
          fi

      - name: Build with sbt
        timeout-minutes: 10
        run: sbt "clean ; test ; jibDockerBuild ; jibWriteDockerTagsFile"

      - name: Get git info
        id: git-info
        run: |
          echo "-- jib docker image tags --"
          cat .docker-tags.txt
          echo "\n-- git tags --"
          git --no-pager tag --list
          echo "\n--"
          
          echo "github event name: ${{ github.event_name }}"
          echo "github ref: ${{ github.ref }}"
          
          if [ "${{ github.event_name }}" == "push" ]; then
            commit_sha="${{ github.sha }}"
          else
            commit_sha="${{ github.event.pull_request.head.sha }}"
          fi
          
          commit_tag="$(git tag --points-at HEAD)"
          commit_msg="$(git log -1 --pretty=%s $commit_sha)"
          echo "commit tag: $commit_tag"
          echo "commit_msg=$commit_msg" >> $GITHUB_OUTPUT
          echo "commit msg: $commit_msg"

          # Publish dev on main, latest + version on a release tag,
          # or on any build whose commit message contains #publish.
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "$commit_msg" == *"#publish"* ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Docker image with arch suffix
        if: steps.git-info.outputs.publish == 'true'
        run: |
          # The .docker-tags.txt file is created by the jibWriteDockerTagsFile task in the build.sbt.
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            docker tag $IMAGE:$tag $IMAGE:$tag-${{ matrix.arch }}
            docker push $IMAGE:$tag-${{ matrix.arch }}
          done < .docker-tags.txt
          
      - name: Upload docker tags artifact
        if: steps.git-info.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: docker-tags-${{ matrix.arch }}
          path: backend/.docker-tags.txt
          include-hidden-files: true

  create-manifest:
    needs: build-backend
    runs-on: ubuntu-24.04
    if: needs.build-backend.result == 'success' && needs.build-backend.outputs.publish == 'true'

    steps:
      - name: Download docker tags
        uses: actions/download-artifact@v6
        with:
          name: docker-tags-amd64
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # GHCR requires lowercase names, so normalize the owner.
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$DOCKER_REGISTRY/$OWNER/$IMAGE_NAME
          while IFS= read -r tag || [ -n "$tag" ]; do
            echo "Creating manifest for $IMAGE:$tag"
            docker manifest create $IMAGE:$tag \
              $IMAGE:$tag-amd64 \
              $IMAGE:$tag-arm64
          
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-amd64 --os linux --arch amd64
            docker manifest annotate $IMAGE:$tag $IMAGE:$tag-arm64 --os linux --arch arm64
          
            docker manifest push $IMAGE:$tag
          done < .docker-tags.txt

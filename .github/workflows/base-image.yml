name: Build base image

on:
  # Manual rebuilds, plus every change to the Dockerfile. Pull requests only validate the build.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docker/base/**']
  pull_request:
    paths: ['docker/base/**']

permissions:
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: amony-base

jobs:
  build-base:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase names, so normalize the owner.
      - name: Compute image reference
        id: image
        run: |
          echo "ref=${DOCKER_REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          # Sortable build timestamp, tracked by Renovate through baseImageTag in backend/build.sbt.
          echo "tag=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/base
          file: docker/base/Dockerfile
          # Pull requests validate the Dockerfile on one platform; published builds cover both.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Amony base image (Eclipse Temurin 25 JRE + ffmpeg + imagemagick)
            org.opencontainers.image.licenses=MIT

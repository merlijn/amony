server {
	listen 80;
	root /srv/web/current;

	# Serve the .gz files produced by the frontend build instead of compressing on every request.
	gzip_static on;
	gzip_vary on;

	# Build outputs are content-hashed, so they can be cached indefinitely.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		# index.html is the only file whose name does not change, so it must not be cached.
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}

name: amony

services:
  postgres:
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME}", "-d", "amony"]
      interval: 3s
      timeout: 3s
      retries: 5
    container_name: amony-postgres
    image: postgres:17.2
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: "amony"
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    restart: always
    volumes:
      - ${AMONY_DATA:-./data}/postgres:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    profiles:
      - otel
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # gRPC

#  open-observe:
#    image: public.ecr.aws/zinclabs/openobserve:latest
#    container_name: open-observe
#    ports:
#      - "5080:5080"
#      - "4317:4317" # gRPC
#    env_file:
#      - .env
#    environment:
#      ZO_ROOT_USER_EMAIL: root@example.com
#      ZO_ROOT_USER_PASSWORD: password
#    volumes:
#      - ${AMONY_DATA:-./data}/open-observe:/data

  postgres-restore:
    image: postgres:17.2
    container_name: amony-postgres-restore
    profiles:
      - restore
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: amony
      BACKUP_DIR: /backups
      RESTORE_FILE: ${RESTORE_FILE}
    volumes:
      - ./docker/scripts/pg-restore.sh:/scripts/pg-restore.sh:ro
      - ${AMONY_DATA:-./data}/backups:/backups:ro
    entrypoint: ["/scripts/pg-restore.sh"]

  postgres-backup:
    image: postgres:17.2
    container_name: amony-postgres-backup
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: amony
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_DIR: /backups
      BACKUP_ON_STARTUP: ${BACKUP_ON_STARTUP:-false}
    volumes:
      - ./docker/scripts/pg-backup.sh:/scripts/pg-backup.sh:ro
      - ./docker/scripts/backup-entrypoint.sh:/scripts/backup-entrypoint.sh:ro
      - ${AMONY_DATA:-./data}/backups:/backups
    restart: unless-stopped
    entrypoint: ["/scripts/backup-entrypoint.sh"]

  amony:
    image: ghcr.io/merlijn/amony-app:latest
    container_name: amony-app
    depends_on:
      postgres:
        condition: service_healthy
      postgres-restore:
        condition: service_completed_successfully
        required: false
    user: "${AMONY_DOCKER_USER_ID}:${AMONY_DOCKER_USER_ID}"
    ports:
      - "127.0.0.1:8182:8182"
    env_file:
      - .env
    environment:
      DATABASE_HOST: "postgres"
      # OAuth provider endpoints. The authorize URL is browser-facing; token/userinfo are internal
      # to the compose network. The HTTPS overlay overrides the authorize URLs.
      AMONY_OAUTH_AUTHORIZE_URL: ${AMONY_OAUTH_AUTHORIZE_URL:-http://localhost:5556/dex/auth}
      AMONY_OAUTH_TOKEN_URL: ${AMONY_OAUTH_TOKEN_URL:-http://auth:5556/dex/token}
      AMONY_OAUTH_USERINFO_URL: ${AMONY_OAUTH_USERINFO_URL:-http://auth:5556/dex/userinfo}
      # Client secrets are shared with Dex: the single DEX_* values are mapped to the backend's AMONY_* vars.
      AMONY_OAUTH_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-amony-dex-secret}
      AMONY_ADMIN_OAUTH_CLIENT_ID: ${AMONY_ADMIN_OAUTH_CLIENT_ID:-admin-app}
      AMONY_ADMIN_OAUTH_CLIENT_SECRET: ${DEX_ADMIN_CLIENT_SECRET:-amony-admin-dex-secret}
      AMONY_ADMIN_OAUTH_AUTHORIZE_URL: ${AMONY_OAUTH_AUTHORIZE_URL:-http://localhost:5556/dex/auth}
      AMONY_ADMIN_OAUTH_TOKEN_URL: ${AMONY_OAUTH_TOKEN_URL:-http://auth:5556/dex/token}
      AMONY_ADMIN_OAUTH_USERINFO_URL: ${AMONY_OAUTH_USERINFO_URL:-http://auth:5556/dex/userinfo}
    volumes:
      - ${AMONY_HOST_MEDIA_PATH}:/media
      - ${AMONY_DATA:-./data}/solr:/app/data/solr
    restart: "no"

  # Local/demo identity provider (Dex). Enable with: docker compose --profile dex up -d
  auth:
    image: dexidp/dex:latest
    container_name: auth
    profiles:
      - dex
    restart: unless-stopped
    ports:
      - "127.0.0.1:5556:5556"
    env_file:
      - .env
    environment:
      # Values rendered into docker/dex/config.yaml.tmpl by the image's built-in gomplate
      # entrypoint. The HTTPS overlay overrides these with the public domain names.
      DEX_ISSUER: ${DEX_ISSUER:-http://localhost:5556/dex}
      DEX_AMONY_REDIRECT_URI: ${DEX_AMONY_REDIRECT_URI:-http://localhost:8182/api/auth/callback/dex,http://localhost:5173/api/auth/callback/dex}
      DEX_AMONY_ADMIN_REDIRECT_URI: ${DEX_AMONY_ADMIN_REDIRECT_URI:-http://localhost:5174/api/auth/callback/admin}
      # Dev defaults; override through .env (see .env.example). Note the escaped $$ for the bcrypt hash.
      DEX_CLIENT_SECRET: ${DEX_CLIENT_SECRET:-amony-dex-secret}
      DEX_ADMIN_CLIENT_SECRET: ${DEX_ADMIN_CLIENT_SECRET:-amony-admin-dex-secret}
      DEX_ADMIN_EMAIL: ${DEX_ADMIN_EMAIL:-admin@amony.example}
      DEX_ADMIN_USERNAME: ${DEX_ADMIN_USERNAME:-admin}
      DEX_ADMIN_PASSWORD_HASH: ${DEX_ADMIN_PASSWORD_HASH:-$$2a$$10$$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W}
    volumes:
      - ./docker/dex/config.yaml.tmpl:/etc/dex/config.yaml.tmpl:ro
    command: ["dex", "serve", "/etc/dex/config.yaml.tmpl"]

  # Trial identity provider (Zitadel). Enable with: docker compose --profile zitadel up -d
  # First run initializes the schema, which takes a while; later starts are fast. The console is at
  # http://localhost:8080/ui/console (login: zitadel-admin / ZITADEL_ADMIN_PASSWORD).
  # Point the app at it by setting the AMONY_OAUTH_* / AMONY_OAUTH_PROVIDER_TYPE variables in .env
  # (see .env.example) and register the redirect URI http://localhost:8182/api/auth/callback/<name>.
  zitadel-db:
    image: postgres:17.2
    container_name: zitadel-postgres
    profiles:
      - zitadel
    environment:
      POSTGRES_DB: "zitadel"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD:-postgres}
    volumes:
      - ${AMONY_DATA:-./data}/zitadel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "zitadel"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.15.3}
    container_name: zitadel
    profiles:
      - zitadel
    # Zitadel writes its data into the container filesystem; the upstream compose also runs it as root.
    user: "0"
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNAL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://postgres:${ZITADEL_DB_PASSWORD:-postgres}@zitadel-db:5432/zitadel?sslmode=disable"
      # Login V2 needs a separate container; the bundled legacy login keeps the trial single-container.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      - --tlsMode
      - disabled
    restart: unless-stopped
